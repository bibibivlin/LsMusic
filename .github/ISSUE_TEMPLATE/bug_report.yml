name: 问题报告
description: 报告可以稳定复现的错误或兼容性问题
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先搜索现有 Issue。日志中不要包含 ListenBrainz 令牌、私人媒体地址或其他敏感信息。
  - type: input
    id: version
    attributes:
      label: L's Music 版本
      placeholder: 例如 v1.0.0 或具体 commit
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与 Android 版本
      placeholder: 例如 Pixel 9 / Android 16
    validations:
      required: true
  - type: dropdown
    id: playback
    attributes:
      label: 播放路径
      options:
        - 远程 DLNA 播放
        - 本机 Media3 播放
        - 与播放无关
    validations:
      required: true
  - type: input
    id: dlna
    attributes:
      label: 媒体服务器与播放设备
      description: 如涉及 DLNA，请填写软件或设备型号；不涉及可填“无”。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为与实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志或截图
      description: 可将文件拖到这里。请先移除令牌、IP 地址和私人媒体信息。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未找到相同问题。
          required: true
        - label: 我已从日志和截图中移除敏感信息。
          required: true
